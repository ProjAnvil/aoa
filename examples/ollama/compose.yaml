# Baseline: langchain-golang Ollama client prints hello world.
#   docker compose up --build --abort-on-container-exit
name: aoa_example_ollama

services:
  builder:
    image: golang:1.27-alpine
    working_dir: /work/aoa
    environment:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: arm64
      GOMODCACHE: /gomodcache
      GOCACHE: /gocache
    volumes:
      - ../..:/work/aoa:ro
      - ../../../langchain_port/langchain_golang:/work/langchain_port/langchain_golang:ro
      - ./bin:/out
      - gomodcache:/gomodcache
      - gocache:/gocache
    command:
      - sh
      - -c
      - go build -o /out/aoad ./cmd/aoad && go build -o /out/aoa-probe ./examples/cmd/probe

  ollama:
    image: ollama/ollama:latest
    environment: &ollamaenv
      OLLAMA_KEEP_ALIVE: 10m
      HTTP_PROXY: ${AOA_EXAMPLE_PROXY:-}
      HTTPS_PROXY: ${AOA_EXAMPLE_PROXY:-}
      http_proxy: ${AOA_EXAMPLE_PROXY:-}
      https_proxy: ${AOA_EXAMPLE_PROXY:-}
      NO_PROXY: "localhost,127.0.0.1,ollama,redis,nats,redpanda,aoad,sink"
      no_proxy: "localhost,127.0.0.1,ollama,redis,nats,redpanda,aoad,sink"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  pull-model:
    image: curlimages/curl:8.11.1
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - -sS
      - --max-time
      - "1200"
      - -X
      - POST
      - http://ollama:11434/api/pull
      - -H
      - "Content-Type: application/json"
      - -d
      - '{"name":"${OLLAMA_MODEL:-qwen2.5:0.5b}","stream":false,"insecure":true}'

  hello:
    image: alpine:3.20
    depends_on:
      builder:
        condition: service_completed_successfully
      pull-model:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
    volumes:
      - ./bin:/app:ro
    command: ["/app/aoa-probe", "hello"]
    restart: "no"

volumes:
  ollama:
    name: aoa_shared_ollama_models
  gomodcache:
    name: aoa_shared_gomodcache
  gocache:
    name: aoa_shared_gocache
