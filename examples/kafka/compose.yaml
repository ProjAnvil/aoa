# Kafka consumer group via Redpanda (single node, Kafka wire compatible).
name: aoa_example_kafka

services:
  builder:
    image: golang:1.27-alpine
    working_dir: /work/aoa
    environment:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: arm64
      GOMODCACHE: /gomodcache
      GOCACHE: /gocache
    volumes:
      - ../..:/work/aoa:ro
      - ../../../langchain_port/langchain_golang:/work/langchain_port/langchain_golang:ro
      - ./bin:/out
      - gomodcache:/gomodcache
      - gocache:/gocache
    command:
      - sh
      - -c
      - go build -o /out/aoad ./cmd/aoad && go build -o /out/aoa-probe ./examples/cmd/probe

  ollama:
    image: ollama/ollama:latest
    environment:
      HTTP_PROXY: ${AOA_EXAMPLE_PROXY:-}
      HTTPS_PROXY: ${AOA_EXAMPLE_PROXY:-}
      http_proxy: ${AOA_EXAMPLE_PROXY:-}
      https_proxy: ${AOA_EXAMPLE_PROXY:-}
      NO_PROXY: "localhost,127.0.0.1,ollama,redis,nats,redpanda,aoad,sink"
      no_proxy: "localhost,127.0.0.1,ollama,redis,nats,redpanda,aoad,sink"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  pull-model:
    image: curlimages/curl:8.11.1
    depends_on:
      ollama:
        condition: service_healthy
    command: ["-sS", "--max-time", "1200", "-X", "POST",
      "http://ollama:11434/api/pull", "-H", "Content-Type: application/json",
      "-d", '{"name":"${OLLAMA_MODEL:-qwen2.5:0.5b}","stream":false,"insecure":true}']

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --default-log-level=warn
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers redpanda:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  aoad:
    image: alpine:3.20
    depends_on:
      builder:
        condition: service_completed_successfully
      pull-model:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    environment:
      AOA_ADDR: ":8080"
      AOA_DB: /data/aoa.db
      AOA_CKPT_DB: /data/aoa-ckpt.db
      AOA_MEMORY_DIR: /data/memory
      AOA_LOG_FORMAT: ${AOA_LOG_FORMAT:-text}
      AOA_LOG_LEVEL: ${AOA_LOG_LEVEL:-info}
      AOA_MODEL: ${AOA_MODEL:-offline}
      OLLAMA_HOST: http://ollama:11434
      AOA_PROXY_TOKEN: ${AOA_PROXY_TOKEN:-example-token}
      AOA_SIGNATURE_KEY: ${AOA_SIGNATURE_KEY:-}
      AOA_OUTBOX_WEBHOOK: http://sink:9000/
      AOA_ADAPTERS: webhook
      AOA_BROKERS: kafka
      AOA_KAFKA_BROKERS: redpanda:9092
      AOA_KAFKA_TOPIC: aoa-events
      AOA_KAFKA_GROUP: aoa-worker
    volumes:
      - ./bin:/app:ro
      - data:/data
    command: ["/app/aoad"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 30

  sink:
    image: alpine:3.20
    depends_on:
      builder:
        condition: service_completed_successfully
    volumes:
      - ./bin:/app:ro
    command: ["/app/aoa-probe", "serve", "--addr", ":9000"]

  emit:
    image: alpine:3.20
    depends_on:
      builder:
        condition: service_completed_successfully
      aoad:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    volumes:
      - ./bin:/app:ro
    command: ["/app/aoa-probe", "publish-kafka", "--brokers", "redpanda:9092",
      "--topic", "aoa-events", "--payload", "P95 > 800ms"]
    restart: "no"

volumes:
  ollama:
    name: aoa_shared_ollama_models
  gomodcache:
    name: aoa_shared_gomodcache
  gocache:
    name: aoa_shared_gocache
  redpanda-data: {}
  data: {}
